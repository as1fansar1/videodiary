<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#FF8A6B"/>
  <rect x="20" y="20" width="152" height="152" rx="28" fill="#FBF7F0"/>
  <!-- Video camera body -->
  <rect x="40" y="68" width="80" height="56" rx="10" fill="#1a1a1a"/>
  <!-- Camera lens -->
  <circle cx="80" cy="96" r="20" fill="#FF8A6B"/>
  <circle cx="80" cy="96" r="13" fill="#1a1a1a"/>
  <!-- Viewfinder triangle (play) -->
  <polygon points="73,89 73,103 88,96" fill="#FBF7F0"/>
  <!-- Camera side wing -->
  <rect x="120" y="76" width="32" height="12" rx="4" fill="#1a1a1a"/>
  <rect x="120" y="104" width="32" height="12" rx="4" fill="#1a1a1a"/>
  <!-- Record dot -->
  <circle cx="136" cy="96" r="5" fill="#FF8A6B"/>
</svg>
